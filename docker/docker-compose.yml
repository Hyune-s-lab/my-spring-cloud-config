name: common-config

services:
  openbao:
    image: ghcr.io/openbao/openbao:2.5.3
    container_name: common-config-openbao
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    env_file:
      - .env
    environment:
      BAO_ADDR: "http://127.0.0.1:8200"
    command: [ "/bin/sh", "/usr/local/bin/openbao-bootstrap.sh" ]
    volumes:
      - openbao-data:/openbao/data
      - ./openbao/bootstrap.sh:/usr/local/bin/openbao-bootstrap.sh:ro
    healthcheck:
      test: [ "CMD", "bao", "status" ]
      interval: 10s
      timeout: 5s
      retries: 12

  common-config:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${COMMON_CONFIG_IMAGE:-common-config:latest}
    container_name: common-config-server
    depends_on:
      - openbao
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      OPENBAO_HOST: "openbao"
      OPENBAO_PORT: "8200"
      OPENBAO_SCHEME: "http"
      SPRING_PROFILES_ACTIVE: "onprem"

volumes:
  openbao-data:
